# Application Info
spring.application.name=livingdocs-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Database: hỗ trợ cả chuỗi JDBC URL đầy đủ (Supabase / Neon) lẫn cấu hình biến lẻ
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:livingdocs}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:LivingDocs}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:chau123456}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration (Using existing ContainerLivingDocs schema)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration (Disabled)
spring.flyway.enabled=false

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── JWT Authentication (Thời hạn 7 ngày = 604800 giây để tránh bị hết hạn token đột ngột) ──
jwt.secret=${JWT_SECRET:LivingDocsSecureJwtSecretKeyMustBeAtLeast256BitsLongForHS256Security}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}

# ── GitHub OAuth2 (Đăng nhập bằng GitHub) ──
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:${GITHUB_CLIENT_ID:}}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:}}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:${GITHUB_REDIRECT_URI:https://livingdocs-ai.vercel.app/api/auth/github/callback}}
github.oauth.frontend-url=${GITHUB_OAUTH_FRONTEND_URL:${GITHUB_FRONTEND_URL:https://livingdocs-ai.vercel.app}}
github.oauth.scope=${GITHUB_OAUTH_SCOPE:${GITHUB_SCOPE:repo read:user user:email}}

# Tắt tự động kết nối RabbitMQ và Redis khi chưa nạp config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# AI Engine (FastAPI) URL
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}

# ── Google Gemini Cloud Direct Client (Tự động kích hoạt trên Production Render & Fallback) ──
gemini.api-keys=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# ── GitHub Webhook Secret ──
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# ── Tối ưu hóa bộ nhớ cho môi trường Free Tier 512MB RAM ──
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=4
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── Multipart File Upload (Cho phép tải lên tệp tin tối đa 100MB) ──
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── GitHub Token Integrity & Auto Revocation Check Worker ──
github.token.integrity-check.enabled=true
# Quét định kỳ mỗi 5 phút (300,000 ms), lần quét đầu sau khi khởi động 30 giây
github.token.integrity-check.fixed-rate=300000
github.token.integrity-check.initial-delay=30000
