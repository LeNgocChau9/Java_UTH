# Application Info
spring.application.name=livingdocs-backend
server.port=8080

# Database: docker compose map ${DB_PORT:-5433} trên máy host vào Postgres cổng 5432
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:LivingDocs}
spring.datasource.username=${POSTGRES_USER:LivingDocs}
spring.datasource.password=${POSTGRES_PASSWORD:chau123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration (Using existing ContainerLivingDocs schema)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration (Disabled)
spring.flyway.enabled=false

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── JWT Authentication (Thời hạn 7 ngày = 604800 giây để tránh bị hết hạn token đột ngột) ──
jwt.secret=${JWT_SECRET:LivingDocsSecureJwtSecretKeyMustBeAtLeast256BitsLongForHS256Security}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}

# ── GitHub OAuth2 (Đăng nhập bằng GitHub) ──
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:${GITHUB_CLIENT_ID:Ov23liRyWxsd1w2R26sp}}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:08f6eccadcf6a4d7d5c0274167ff5ede1c1d79df}}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}}
github.oauth.frontend-url=${GITHUB_OAUTH_FRONTEND_URL:${GITHUB_FRONTEND_URL:http://localhost:3000}}
github.oauth.scope=${GITHUB_OAUTH_SCOPE:${GITHUB_SCOPE:read:user user:email}}

# Tắt tự động kết nối RabbitMQ và Redis khi chưa nạp config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# AI Engine (FastAPI) URL
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}

# ── GitHub Webhook Secret ──
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}
