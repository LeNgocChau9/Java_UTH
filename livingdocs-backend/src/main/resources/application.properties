# Application Info
spring.application.name=livingdocs-backend
server.port=8080

# Database Connection (PostgreSQL 16 + pgvector)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:livingdocs}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── GitHub OAuth2 (Đăng nhập bằng GitHub) ──
# Tạo OAuth App tại: https://github.com/settings/developers (Authorization callback URL
# phải khớp github.oauth.redirect-uri bên dưới). Có thể set qua biến môi trường
# GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET. Để trống = chức năng chưa bật.
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:${GITHUB_CLIENT_ID:}}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:}}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}}
github.oauth.frontend-url=${GITHUB_OAUTH_FRONTEND_URL:${GITHUB_FRONTEND_URL:http://localhost:3000}}
github.oauth.scope=${GITHUB_OAUTH_SCOPE:${GITHUB_SCOPE:read:user user:email}}

# Tắt tự động kết nối RabbitMQ và Redis khi chưa nạp config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# AI Engine (FastAPI) URL
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}

# ── GitHub Webhook Secret ──
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

