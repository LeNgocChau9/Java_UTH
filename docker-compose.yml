# LivingDocs: Postgres và pgAdmin cùng mạng livingdocs.
# Cổng máy host lấy từ .env (DB_PORT=5433) để khớp Spring Boot.
# Trong mạng Docker, backend nối host "postgres" cổng 5432.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: livingdocs-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livingdocs}
      POSTGRES_USER: ${POSTGRES_USER:-LivingDocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chau123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - livingdocs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: livingdocs-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@livingdocs.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - livingdocs

networks:
  livingdocs:
    name: livingdocs

volumes:
  postgres_data:
  pgadmin_data:
